name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux system deps (GUI/egui)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libx11-dev libxkbcommon-x11-dev

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Test
        run: cargo test --workspace

      # The aistudio bridge is Python, and its regressions (picking a nekoray
      # wrapper as a core, clobbering the server pool, printing stale egress)
      # were all invisible to cargo test. Guard them here.
      - name: Test Python bridge helpers
        run: |
          # Some runner images ship a pytest already; others are PEP 668
          # "externally managed", where a bare `pip install` fails. Try the
          # installed one first, then fall back to a user-scoped install.
          if ! python3 -m pytest --version >/dev/null 2>&1; then
            python3 -m pip install --quiet --user --break-system-packages pytest \
              || python3 -m pip install --quiet --user pytest
          fi
          python3 -m pytest tests/ -q

      - name: Build release
        run: cargo build --release --workspace
