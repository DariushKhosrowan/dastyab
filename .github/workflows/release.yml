name: Release

# Automatic release builder. Triggered by pushing a `v*` tag (e.g. v0.1.0).
# Builds the full workspace natively on each target runner and publishes a
# GitHub Release containing .deb installers (Linux), .exe / portable zip
# (Windows), raw binaries for all platforms, and a SHA256SUMS.txt file.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: build-${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-amd64
            arch: amd64
            deb: true
          - os: ubuntu-24.04-arm
            artifact: linux-arm64
            arch: arm64
            deb: true
          - os: windows-latest
            artifact: windows-amd64
            arch: amd64
            exe: true
            zip: true
          - os: macos-latest
            artifact: macos-arm64
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps (GUI/egui)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libx11-dev libxkbcommon-x11-dev

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.artifact }}-release-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.artifact }}-release-cargo-

      - name: Build workspace (release)
        run: cargo build --release --workspace

      - name: Fetch cargo-deb
        if: matrix.deb
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      - name: Build .deb (CLI)
        if: matrix.deb
        run: |
          cargo deb -p dastyab-cli --no-build
          ls -la target/debian/

      - name: Stage release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          BASE="${{ matrix.artifact }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            EXT=".exe"
          else
            EXT=""
          fi
          for bin in dastyab dastyab-tui dastyab-gui; do
            cp "target/release/${bin}${EXT}" "dist/${bin}-${BASE}${EXT}"
          done
          # Ship the helper scripts, so `dastyab aistudio` works from a bare
          # binary download: the CLI looks for them beside the executable.
          cp dastyab-aistudio.py dist/ 2>/dev/null || true
          cp dastyab-aistudio-cleanip.py dist/ 2>/dev/null || true
          cp dastyab-aistudio.sh dist/ 2>/dev/null || true
          if [ "${{ matrix.deb }}" = "true" ]; then
            deb_file=$(ls target/debian/*_${{ matrix.arch }}.deb 2>/dev/null | head -n1)
            if [ -z "$deb_file" ]; then
              echo "ERROR: no .deb found for arch ${{ matrix.arch }}"
              ls -la target/debian/ || true
              exit 1
            fi
            cp "$deb_file" "dist/dastyab-${BASE}.deb"
          fi
          if [ "${{ matrix.zip }}" = "true" ]; then
            python scripts/bundle_windows.py "${{ matrix.artifact }}"
          fi
          ls -la dist/

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: dastyab-release-${{ matrix.artifact }}
          path: dist/**
          if-no-files-found: error

  build-android:
    name: build-android-${{ matrix.arch }}
    # Cross-compile the `dastyab` CLI for Android. The workspace is pure Rust
    # (rustls TLS, no C deps, no build scripts), so only the Android NDK clang
    # is needed as the cross-linker. Artifacts are picked up by the `release`
    # job below and attached to the GitHub Release alongside the other builds.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            arch: aarch64
          - target: armv7-linux-androideabi
            arch: armv7
          - target: x86_64-linux-android
            arch: x86_64
          - target: i686-linux-android
            arch: i686
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Android SDK command-line tools
        run: |
          mkdir -p /tmp/android-sdk/cmdline-tools
          curl -fsSL -o /tmp/cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q -d /tmp/android-sdk/cmdline-tools /tmp/cmdline-tools.zip
          mv /tmp/android-sdk/cmdline-tools/cmdline-tools /tmp/android-sdk/cmdline-tools/latest
          echo "ANDROID_SDK_ROOT=/tmp/android-sdk" >> "$GITHUB_ENV"
          echo "/tmp/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android NDK via sdkmanager
        run: |
          yes | sdkmanager --licenses
          sdkmanager "ndk;27.0.12077973"
          echo "ANDROID_NDK_ROOT=/tmp/android-sdk/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "/tmp/android-sdk/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Build dastyab CLI for Android
        shell: bash
        env:
          ANDROID_NDK_ROOT: /tmp/android-sdk/ndk/27.0.12077973
        run: |
          set -euo pipefail
          TARGET="${{ matrix.target }}"
          case "$TARGET" in
            aarch64-linux-android)   NDK_TRIPLE="aarch64-linux-android"   ; NDK_API=33 ;;
            armv7-linux-androideabi) NDK_TRIPLE="armv7a-linux-androideabi" ; NDK_API=33 ;;
            x86_64-linux-android)    NDK_TRIPLE="x86_64-linux-android"    ; NDK_API=33 ;;
            i686-linux-android)      NDK_TRIPLE="i686-linux-android"      ; NDK_API=33 ;;
            *) echo "ERROR: unknown Android target '$TARGET'" >&2; exit 1 ;;
          esac
          LINKER="${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin/${NDK_TRIPLE}${NDK_API}-clang"
          [ -x "$LINKER" ] || { echo "ERROR: NDK clang linker not found: $LINKER" >&2; exit 1; }
          # Cargo reads CARGO_TARGET_<TRIPLE_UPPER_UNDERSCORE>_LINKER
          ENV_VAR="CARGO_TARGET_$(printf '%s' "$TARGET" | tr '[:lower:]-' '[:upper:]_')_LINKER"
          export "$ENV_VAR"="$LINKER"
          # ring's build.rs uses cc-rs, which probes CC_<target> for the C
          # compiler. cc-rs expects the LOWERCASE target with dashes→underscores
          # (e.g. CC_armv7_linux_androideabi), NOT uppercase like Cargo's
          # CARGO_TARGET_*_LINKER. NDK 27 ships <triple><api>-clang wrappers,
          # not the bare <rust-target>-clang names cc-rs guesses, so point CC
          # directly. Also export AR_<target> for the NDK llvm-ar.
          CC_VAR="CC_$(printf '%s' "$TARGET" | tr '-' '_')"
          AR_TOOL="${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          export "$CC_VAR"="$LINKER"
          export "AR_$(printf '%s' "$TARGET" | tr '-' '_')"="$AR_TOOL"

          cargo build --release --target "$TARGET" -p dastyab-cli

          mkdir -p dist
          cp "target/${TARGET}/release/dastyab" "dist/dastyab-android-${{ matrix.arch }}"
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: dastyab-release-android-${{ matrix.arch }}
          path: dist/dastyab-android-${{ matrix.arch }}
          if-no-files-found: error

  build-apk:
    name: build-apk (Android app)
    # Builds the signed Kotlin launcher APK (downloads the dastyab-android-*
    # CLI binary from the latest GitHub Release on first app launch).
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Use the runner's preinstalled SDK (ANDROID_HOME/ANDROID_SDK_ROOT are
      # already set and consistent) — do NOT override them. Setting
      # ANDROID_HOME="" makes AGP guess a bogus SDK path (the android/ project
      # dir) and abort with "different paths to the SDK".
      - name: Ensure SDK components (platform 34 + build-tools 34.0.0)
        run: |
          SDK="$ANDROID_HOME"
          echo "Using SDK: $SDK"
          if [ ! -d "$SDK/platforms/android-34" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
            "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "platform-tools" >/dev/null
          fi

      - name: Build signed release APK
        run: |
          cd android
          chmod +x gradlew
          # Point Gradle at the SDK this job installed, via the canonical
          # sdk.dir location file (env-only overrides confused AGP 8.x).
          echo "sdk.dir=/tmp/android-sdk" > local.properties
          ./gradlew :app:assembleRelease --no-daemon

      - name: Re-sign with v1+v2+v3 schemes (installer compatibility)
        run: |
          mkdir -p dist
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
            --ks android/dastyab-release.keystore --ks-key-alias dastyab \
            --ks-pass pass:dastyab-release --key-pass pass:dastyab-release \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out dist/DastYab-android.apk \
            android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify \
            --verbose dist/DastYab-android.apk | tee /tmp/verify.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/verify.txt || {
            echo "ERROR: APK not v2-signed" >&2; exit 1; }
          grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" /tmp/verify.txt || {
            echo "ERROR: APK not v3-signed" >&2; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: dastyab-release-android-apk
          path: dist/DastYab-android.apk
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs:
      - build
      - build-android
      - build-apk
    runs-on: ubuntu-latest
    steps:
      - name: Download all release assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256 checksums
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
