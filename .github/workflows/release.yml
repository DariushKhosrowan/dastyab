name: Release

# Automatic release builder. Triggered by pushing a `v*` tag (e.g. v0.1.0).
# Builds the full workspace natively on each target runner and publishes a
# GitHub Release containing .deb installers (Linux), .exe / portable zip
# (Windows), raw binaries for all platforms, and a SHA256SUMS.txt file.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: build-${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-amd64
            arch: amd64
            deb: true
          - os: ubuntu-24.04-arm
            artifact: linux-arm64
            arch: arm64
            deb: true
          - os: windows-latest
            artifact: windows-amd64
            arch: amd64
            exe: true
            zip: true
          - os: macos-latest
            artifact: macos-arm64
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps (GUI/egui)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libx11-dev libxkbcommon-x11-dev

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.artifact }}-release-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.artifact }}-release-cargo-

      - name: Build workspace (release)
        run: cargo build --release --workspace

      - name: Fetch cargo-deb
        if: matrix.deb
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      - name: Build .deb (CLI)
        if: matrix.deb
        run: |
          cargo deb -p dastyab-cli --no-build
          ls -la target/debian/

      - name: Stage release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          BASE="${{ matrix.artifact }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            EXT=".exe"
          else
            EXT=""
          fi
          for bin in dastyab dastyab-tui dastyab-gui; do
            cp "target/release/${bin}${EXT}" "dist/${bin}-${BASE}${EXT}"
          done
          # Ship the helper scripts, so `dastyab aistudio` works from a bare
          # binary download: the CLI looks for them beside the executable.
          cp dastyab-aistudio.py dist/ 2>/dev/null || true
          cp dastyab-aistudio-cleanip.py dist/ 2>/dev/null || true
          cp dastyab-aistudio.sh dist/ 2>/dev/null || true
          if [ "${{ matrix.deb }}" = "true" ]; then
            deb_file=$(ls target/debian/*_${{ matrix.arch }}.deb 2>/dev/null | head -n1)
            if [ -z "$deb_file" ]; then
              echo "ERROR: no .deb found for arch ${{ matrix.arch }}"
              ls -la target/debian/ || true
              exit 1
            fi
            cp "$deb_file" "dist/dastyab-${BASE}.deb"
          fi
          if [ "${{ matrix.zip }}" = "true" ]; then
            python scripts/bundle_windows.py "${{ matrix.artifact }}"
          fi
          ls -la dist/

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: dastyab-release-${{ matrix.artifact }}
          path: dist/**
          if-no-files-found: error

  build-android:
    name: build-android-${{ matrix.arch }}
    # Cross-compile the `dastyab` CLI for Android. The workspace is pure Rust
    # (rustls TLS, no C deps, no build scripts), so only the Android NDK clang
    # is needed as the cross-linker. Artifacts are picked up by the `release`
    # job below and attached to the GitHub Release alongside the other builds.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            arch: aarch64
          - target: armv7-linux-androideabi
            arch: armv7
          - target: x86_64-linux-android
            arch: x86_64
          - target: i686-linux-android
            arch: i686
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Android NDK (r30)
        run: |
          NDK_VERSION=r30
          NDK_ZIP="android-ndk-${NDK_VERSION}-linux.zip"
          curl -fsSL -o "/tmp/${NDK_ZIP}" "https://dl.google.com/android/repository/${NDK_ZIP}"
          unzip -q -d /tmp "/tmp/${NDK_ZIP}"
          echo "ANDROID_NDK_ROOT=/tmp/android-ndk-${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "/tmp/android-ndk-${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Build dastyab CLI for Android
        shell: bash
        env:
          ANDROID_NDK_ROOT: /tmp/android-ndk-r30
        run: |
          set -euo pipefail
          TARGET="${{ matrix.target }}"
          case "$TARGET" in
            aarch64-linux-android)   NDK_TRIPLE="aarch64-linux-android"   ;;
            armv7-linux-androideabi) NDK_TRIPLE="armv7a-linux-androideabi" ;;
            x86_64-linux-android)    NDK_TRIPLE="x86_64-linux-android"    ;;
            i686-linux-android)      NDK_TRIPLE="i686-linux-android"      ;;
            *) echo "ERROR: unknown Android target '$TARGET'" >&2; exit 1 ;;
          esac
          LINKER="/tmp/android-ndk-r30/toolchains/llvm/prebuilt/linux-x86_64/bin/${NDK_TRIPLE}33-clang"
          [ -x "$LINKER" ] || { echo "ERROR: NDK clang linker not found: $LINKER" >&2; exit 1; }
          # Cargo reads CARGO_TARGET_<TRIPLE_UPPER_UNDERSCORE>_LINKER
          ENV_VAR="CARGO_TARGET_$(printf '%s' "$TARGET" | tr '[:lower:]-' '[:upper:]_')_LINKER"
          export "$ENV_VAR"="$LINKER"

          cargo build --release --target "$TARGET" -p dastyab-cli

          mkdir -p dist
          cp "target/${TARGET}/release/dastyab" "dist/dastyab-android-${{ matrix.arch }}"
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: dastyab-release-android-${{ matrix.arch }}
          path: dist/dastyab-android-${{ matrix.arch }}
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs:
      - build
      - build-android
    runs-on: ubuntu-latest
    steps:
      - name: Download all release assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256 checksums
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
