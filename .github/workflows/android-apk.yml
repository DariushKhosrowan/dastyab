name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    
env:
  ANDROID_SDK_ROOT: /home/runner/android-sdk
  ANDROID_NDK_ROOT: /home/runner/android-sdk/ndk/25.1.8937393

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Install Android SDK Command-line tools
        run: |
          mkdir -p /home/runner/android-sdk/cmdline-tools
          curl -fsSL -o /tmp/cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q /tmp/cmdline-tools.zip -d /home/runner/android-sdk/cmdline-tools
          mv /home/runner/android-sdk/cmdline-tools/cmdline-tools /home/runner/android-sdk/cmdline-tools/latest
          
      - name: Accept SDK licenses
        run: |
          yes | /home/runner/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          
      - name: Install SDK platforms and build-tools
        run: |
          /home/runner/android-sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"
          
      - name: Install NDK
        run: |
          yes | /home/runner/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          /home/runner/android-sdk/cmdline-tools/latest/bin/sdkmanager "ndk;25.1.8937393"
          
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradd-${{ runner.os }}-${{ hashFiles('gradle-wrapper.properties') }}
          
      - name: Assemble Debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
