name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'android/**'
  workflow_dispatch:

env:
  ANDROID_HOME: /tmp/android-sdk

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK (platform 34 + build-tools 34.0.0)
        run: |
          mkdir -p /tmp/android-sdk/cmdline-tools
          curl -fsSL -o /tmp/clt.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q -d /tmp/android-sdk/cmdline-tools /tmp/clt.zip
          mv /tmp/android-sdk/cmdline-tools/cmdline-tools /tmp/android-sdk/cmdline-tools/latest
          yes | /tmp/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null
          /tmp/android-sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" >/dev/null

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Verify APK structure and signature
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          unzip -t "$APK" > /dev/null || { echo "ERROR: corrupt APK zip" >&2; exit 1; }
          java -jar /tmp/android-sdk/build-tools/34.0.0/lib/apksigner.jar verify --verbose "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
