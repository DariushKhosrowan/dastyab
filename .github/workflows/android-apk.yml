name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/android-build-native.sh'
      - 'scripts/android-verify-apk.sh'
      - 'scripts/android-emulator-smoke.sh'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/android-build-native.sh'
      - 'scripts/android-verify-apk.sh'
      - 'scripts/android-emulator-smoke.sh'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK components
        run: |
          set -euo pipefail
          SDK=${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}
          if [ -z "$SDK" ]; then
            echo 'GitHub runner did not expose ANDROID_HOME or ANDROID_SDK_ROOT' >&2
            exit 1
          fi
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found under runner SDK: $SDK" >&2
            find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager -print 2>/dev/null || true
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "platform-tools" "build-tools;34.0.0" "emulator" "system-images;android-35;google_apis;x86_64"

      - name: Install Android NDK
        run: |
          set -euo pipefail
          SDK=${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || { echo "sdkmanager not found: $SDKMANAGER" >&2; exit 1; }
          "$SDKMANAGER" "ndk;27.0.12077973"
          echo "ANDROID_NDK_ROOT=$SDK/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_VERSION=27.0.12077973" >> "$GITHUB_ENV"

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-v2-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle.properties', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-v2-

      - name: Run Android unit tests
        working-directory: android
        run: bash ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace --info

      - name: Stage native CLI for all Android ABIs
        run: bash scripts/android-build-native.sh android/app/src/main/jniLibs

      - name: Build debug APK with packaged native binaries
        working-directory: android
        run: bash ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Build signed release APK
        working-directory: android
        run: bash ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify release APK installability, alignment, ABIs, and signatures
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find android/app/build/outputs/apk/release -type f -name '*.apk' -print)
          if [[ ${#apks[@]} -ne 1 ]]; then
            echo "Expected exactly one release APK, found ${#apks[@]}:" >&2
            printf '%s\n' "${apks[@]}" >&2
            exit 1
          fi
          APK="${apks[0]}"
          test -f "$APK"
          bash scripts/android-verify-apk.sh "$APK"
          VERSION=$(grep -o 'versionName = "[^"]*"' android/app/build.gradle.kts | cut -d'"' -f2)
          test -n "$VERSION"
          RELEASE_APK="DastYab-${VERSION}-android.apk"
          cp "$APK" "$RELEASE_APK"
          test -f "$RELEASE_APK"
          echo "RELEASE_APK=$RELEASE_APK" >> "$GITHUB_ENV"

      - name: Enable emulator KVM access
        run: |
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm

      - name: Run instrumentation & release APK install/upgrade/launch tests on emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-linux-hw-accel: false
          script: bash scripts/android-emulator-smoke.sh

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: dastyab-release-android-apk
          path: ${{ env.RELEASE_APK }}
          if-no-files-found: error
          retention-days: 90
