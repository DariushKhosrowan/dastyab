name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    
env:
  ANDROID_SDK_ROOT: /home/runner/android-sdk
  ANDROID_NDK_ROOT: /home/runner/android-sdk/ndk/25.1.8937393
  PATH: /home/runner/android-sdk/cmdline-tools/latest/bin:/home/runner/android-sdk/platform-tools:/opt/gradle-8.2.0/bin:$PATH

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java 1.8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'
          
      - name: Accept SDK licenses
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses
          
      - name: Install SDK platforms and build-tools
        run: |
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"
          
      - name: Install NDK
        run: |
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "ndk;25.1.8937393"
          
      - name: Set up Gradle
        uses: gradle/actions-gradle8-x@v2
        
      - name: Assemble Debug APK
        run: |
          ./gradlew :app:assembleDebug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
